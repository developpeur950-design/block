<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Garde-Redirections</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1b1b1f;
        --muted: #6b7280;
        --line: #e5e7eb;
        --accent: #2563eb;
        --blocked: #dc2626;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1b1b1f;
          --fg: #e8e8ea;
          --muted: #9ca3af;
          --line: #33343a;
          --accent: #60a5fa;
          --blocked: #f87171;
        }
      }
      * { box-sizing: border-box; }
      body {
        width: 360px;
        margin: 0;
        font: 13px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
      }
      h1 { font-size: 14px; margin: 0; }
      .switch { display: flex; align-items: center; gap: 8px; }
      .switch input { width: 36px; height: 20px; }
      .bar {
        display: flex;
        gap: 6px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }
      button {
        font: inherit;
        padding: 6px 10px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--fg);
        border-radius: 7px;
        cursor: pointer;
      }
      button.primary { background: var(--accent); color: #fff; border-color: transparent; }
      #status { padding: 6px 14px; color: var(--muted); min-height: 18px; }
      ul { list-style: none; margin: 0; padding: 0; max-height: 280px; overflow: auto; }
      li { padding: 8px 14px; border-bottom: 1px solid var(--line); }
      .row { display: flex; justify-content: space-between; gap: 8px; }
      .host { font-weight: 600; }
      .ttl { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .time { color: var(--muted); font-size: 11px; white-space: nowrap; }
      .tag { font-size: 10px; padding: 1px 6px; border-radius: 10px; border: 1px solid var(--line); }
      .tag.blocked { color: var(--blocked); border-color: var(--blocked); }
      footer { padding: 8px 14px; color: var(--muted); border-top: 1px solid var(--line); }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <header>
      <h1>Garde-Redirections</h1>
      <label class="switch">
        <span id="stateLabel">Actif</span>
        <input type="checkbox" id="enabled" />
      </label>
    </header>
    <div class="bar">
      <button id="sync" class="primary">Envoyer au serveur</button>
      <button id="clear">Vider le journal</button>
      <button id="options">Options</button>
    </div>
    <div id="status"></div>
    <ul id="log"></ul>
    <footer id="serverInfo"></footer>
    <script src="config.js"></script>
    <script src="common.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
