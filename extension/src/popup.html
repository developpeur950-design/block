<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Garde-Redirections</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff; --fg: #1b1b1f; --muted: #6b7280;
        --line: #e5e7eb; --accent: #2563eb; --danger: #dc2626;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #1b1b1f; --fg: #e8e8ea; --muted: #9ca3af; --line: #33343a; --accent: #60a5fa; --danger: #f87171; }
      }
      * { box-sizing: border-box; }
      body {
        width: 320px; margin: 0;
        font: 13px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg); color: var(--fg);
      }
      header { padding: 12px 14px; border-bottom: 1px solid var(--line); }
      h1 { font-size: 14px; margin: 0; }
      .sub { color: var(--muted); font-size: 11px; margin-top: 2px; }
      ul { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow: auto; }
      li {
        display: flex; align-items: center; justify-content: space-between;
        gap: 8px; padding: 9px 14px; border-bottom: 1px solid var(--line);
      }
      .site { font-weight: 600; word-break: break-all; }
      .empty { padding: 16px 14px; color: var(--muted); }
      button {
        font: inherit; border: 1px solid var(--line); background: transparent;
        color: var(--fg); border-radius: 7px; cursor: pointer;
      }
      .del { padding: 3px 8px; color: var(--danger); border-color: transparent; font-size: 15px; line-height: 1; }
      .del:hover { border-color: var(--danger); }
      .add { display: flex; gap: 6px; padding: 12px 14px; border-top: 1px solid var(--line); }
      .add input {
        flex: 1; padding: 8px 10px; border: 1px solid var(--line);
        border-radius: 7px; background: transparent; color: var(--fg); font: inherit;
      }
      .add button.primary { padding: 8px 12px; background: var(--accent); color: #fff; border-color: transparent; font-weight: 600; }
    </style>
  </head>
  <body>
    <header>
      <h1>Sites bloqués</h1>
      <div class="sub">La sortie de ces sites est bloquée quand tu es dessus.</div>
    </header>
    <ul id="list"></ul>
    <div class="add">
      <input type="text" id="input" placeholder="ex: voir-anime.to" autocomplete="off" />
      <button id="add" class="primary">Ajouter</button>
    </div>
    <script src="config.js"></script>
    <script src="common.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
