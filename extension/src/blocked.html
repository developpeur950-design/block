<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirection bloquée</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff; --fg: #1b1b1f; --muted: #6b7280; --line: #e5e7eb;
        --accent: #2563eb; --blocked: #dc2626;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #16161a; --fg: #e8e8ea; --muted: #9ca3af; --line: #33343a; --accent: #60a5fa; --blocked: #f87171; }
      }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg); color: var(--fg);
      }
      .card {
        max-width: 560px; margin: 24px; padding: 28px; border: 1px solid var(--line);
        border-radius: 14px; text-align: center;
      }
      .icon { font-size: 40px; }
      h1 { font-size: 20px; color: var(--blocked); margin: 10px 0 4px; }
      p { color: var(--muted); margin: 6px 0; }
      .url { word-break: break-all; background: color-mix(in srgb, var(--fg) 8%, transparent);
        padding: 8px 10px; border-radius: 8px; font-family: ui-monospace, monospace; font-size: 13px; }
      .bar { margin-top: 20px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      button, a.btn {
        font: inherit; padding: 9px 16px; border-radius: 9px; cursor: pointer; text-decoration: none;
        border: 1px solid var(--line); background: transparent; color: var(--fg);
      }
      .primary { background: var(--accent); color: #fff; border-color: transparent; }
      .danger { color: var(--blocked); border-color: var(--blocked); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">🛑</div>
      <h1>Redirection bloquée</h1>
      <p>Cette page tentait de t'envoyer vers un autre site :</p>
      <div class="url" id="target"></div>
      <div class="bar">
        <button id="back" class="primary">Retour au site</button>
        <button id="go" class="danger">Ouvrir quand même</button>
      </div>
    </div>
    <script src="blocked.js"></script>
  </body>
</html>
